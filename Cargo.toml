[package]
name = "loom"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
description = "Agent-native task management on a git substrate: CAS leases, derived state, contract-graph scheduling, tiered budgets, and a typed human-oracle escalation queue"
license = "MIT"
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
